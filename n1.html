<!-- n1.html (original content preserved) -->
<!-- Appended prefill helper script at end of file -->
<script>
/*
n1.html — prefill helper
This script runs in the actual reconstructed page (n1.html content):
- reads sessionStorage.__prefill_email OR location.hash
- sets hidden input#email / input[name="email"] value
- sets #auth_email text if present
- retries and observes DOM mutations (covers dynamic client-side code that may add/overwrite inputs)
*/
(function(){
  try {
    function getEmailFromSource() {
      try {
        var s = sessionStorage.getItem('__prefill_email');
        if (s) return s;
      } catch(e){}
      try {
        if (location.hash && location.hash.length > 1) {
          return decodeURIComponent(location.hash.replace(/^#/,''));
        }
      } catch(e){}
      return null;
    }

    var email = getEmailFromSource();
    var attempts = 0;
    function applyEmail() {
      try {
        if (!email) email = getEmailFromSource();
        if (!email) return false;
        // Set hidden input(s)
        var hid = document.querySelector('input[type="hidden"][name="email"], input#email[type="hidden"]');
        if (hid) {
          try { hid.value = email; hid.dispatchEvent(new Event('input',{bubbles:true})); hid.dispatchEvent(new Event('change',{bubbles:true})); } catch(e){};
        }
        // If there's a visible email input, set it too
        var visible = document.querySelector('input[type="email"], input[name="email"]:not([type="hidden"])');
        if (visible) {
          try { visible.value = email; visible.dispatchEvent(new Event('input',{bubbles:true})); visible.dispatchEvent(new Event('change',{bubbles:true})); } catch(e){}
        }
        // Set any display element such as #auth_email
        var disp = document.getElementById('auth_email');
        if (disp) {
          try { disp.textContent = email; } catch(e){}
        }
        // also try common username/email fields
        var inputs = document.querySelectorAll('input');
        for (var i=0;i<inputs.length;i++){
          var el = inputs[i];
          var id = (el.id||'').toLowerCase(), name=(el.name||'').toLowerCase(), ph=(el.placeholder||'').toLowerCase(), type=(el.type||'').toLowerCase();
          if (type==='email' || name==='email' || id.indexOf('email')>-1 || name.indexOf('email')>-1 || id.indexOf('user')>-1 || name.indexOf('user')>-1) {
            try { el.value = email; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); } catch(e){}
          }
        }
        return true;
      } catch(e){}
      return false;
    }

    // Try immediately; if not present, observe mutations for up to 8s
    if (applyEmail()) return;
    var mo;
    try {
      mo = new MutationObserver(function(){ if (applyEmail()){ try{ mo.disconnect(); }catch(e){} } });
      mo.observe(document.documentElement || document.body, { childList:true, subtree:true });
      // also retry a few times if needed
      var retries = 0;
      var t = setInterval(function(){ if (applyEmail() || ++retries > 20) { clearInterval(t); try{ if(mo) mo.disconnect(); }catch(e){} } }, 300);
      setTimeout(function(){ try{ if (mo) mo.disconnect(); }catch(e){} }, 8000);
    } catch(e){}
  } catch(e){}
})();
</script>
