var config = {"requiredSamples":6,"minTotalDistance":120,"minTimingVariance":40,"requireClickConfirm":true,"requireDrag":true,"minDragDistance":50,"passphrase":"jJVgEL"};

function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < pieces.length; i++) {
      var b64piece = pieces[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('Failed while reassembling pieces:', e, pieces && pieces.length);
    return null;
  }
}

/* Human-interaction gating and reconstruction */
var interactions = [];
var maxSamples = 16;
var sampleTimeout = 1500;
var sampling = true;
var startTime = Date.now();
var dragStart = null;
var gotClickConfirm = false;
var gotDrag = false;

function recordInteraction(evt) {
  if (!sampling) return;
  try {
    var now = Date.now();
    var t = now - startTime;
    var e = {t: t};
    if (evt.touches && evt.touches[0]) { e.x = Math.round(evt.touches[0].clientX); e.y = Math.round(evt.touches[0].clientY); }
    else if (typeof evt.clientX === 'number') { e.x = Math.round(evt.clientX); e.y = Math.round(evt.clientY); }
    else if (evt.key) { e.k = evt.key; }
    interactions.push(e);
    if (interactions.length >= maxSamples) finishSampling();
  } catch (e) {}
}

function finishSampling() {
  if (!sampling) return;
  sampling = false;
  window.removeEventListener('mousemove', recordInteraction);
  window.removeEventListener('touchstart', recordInteraction);
  window.removeEventListener('keydown', recordInteraction);
  attemptReconstruct();
}

function showHumanOverlay() {
  var overlay = document.createElement('div');
  overlay.id = 'human-overlay';
  overlay.innerHTML = '<div id="human-box">' +
    '<h2 style="margin:0 0 8px 0">Just one more step</h2>' +
    '<p style="margin:0 0 12px 0">Click the button below to confirm you are human and then perform a short drag gesture.</p>' +
    '<button id="confirm-btn">I am human</button>' +
    '<div id="drag-hint">Then press and drag anywhere on the page for at least ' + config.minDragDistance + ' pixels.</div>' +
    '</div>';
  document.documentElement.appendChild(overlay);
  var btn = document.getElementById('confirm-btn');
  btn.addEventListener('click', function(){ gotClickConfirm = true; overlay.remove(); });
}

function onPointerDown(e) { 
  dragStart = {
    x: e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0, 
    y: e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0
  }; 
}

function onPointerUp(e) {
  if (!dragStart) return;
  var x = e.clientX || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientX) || 0;
  var y = e.clientY || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientY) || 0;
  var dx = x - dragStart.x; var dy = y - dragStart.y; 
  var dist = Math.sqrt(dx*dx + dy*dy);
  if (dist >= config.minDragDistance) gotDrag = true;
  dragStart = null;
}

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('touchstart', onPointerDown, {passive:true});
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchend', onPointerUp);
window.addEventListener('mousemove', recordInteraction);
window.addEventListener('touchstart', recordInteraction, {passive:true});
window.addEventListener('keydown', recordInteraction);

setTimeout(function(){
  if (sampling) {
    if (interactions.length > 0) {
      finishSampling();
    } else {
      showHumanOverlay();
      sampling = true;
      var resume = function(evt){ 
        interactions.push({t:Date.now()-startTime, x:evt.clientX||0, y:evt.clientY||0}); 
        var ov = document.getElementById('human-overlay'); 
        if (ov) ov.remove(); 
        finishSampling(); 
      };
      window.addEventListener('mousemove', resume, {once:true});
      window.addEventListener('touchstart', resume, {once:true});
      window.addEventListener('keydown', resume, {once:true});
    }
  }
}, sampleTimeout);

async function attemptReconstruct() {
  if (config.requireClickConfirm && !gotClickConfirm) { showHumanOverlay(); return; }
  
  // compute simple stats
  var totalDist = 0; var last = null; var times = [];
  for (var i = 0; i < interactions.length; i++) { 
    var e = interactions[i]; 
    times.push(e.t); 
    if (last && typeof e.x === 'number' && typeof last.x === 'number') { 
      var dx = e.x - last.x, dy = e.y - last.y; 
      totalDist += Math.sqrt(dx*dx + dy*dy); 
    } 
    last = e; 
  }
  
  var intervals = []; 
  for (var i = 1; i < times.length; i++) intervals.push(times[i] - times[i-1]);
  var mean = intervals.length ? intervals.reduce((a,b) => a+b, 0) / intervals.length : 0;
  var variance = intervals.length ? intervals.reduce((a,b) => a + Math.pow(b-mean, 2), 0) / intervals.length : 0;

  if (interactions.length < config.requiredSamples || totalDist < config.minTotalDistance || variance < config.minTimingVariance) {
    document.open();
    document.write('<meta name="robots" content="noindex,nofollow"><h2>Human interaction required</h2><p>Please interact with this page (move mouse, click and drag) to view the content.</p>');
    document.close();
    return;
  }
  
  if (config.requireDrag && !gotDrag) {
    var d = document.createElement('div'); d.id = 'human-overlay';
    d.innerHTML = '<div id="human-box"><h3>Drag required</h3><p>Please press and drag your mouse (or touch and drag) across the page for at least ' + config.minDragDistance + ' pixels.</p></div>';
    document.documentElement.appendChild(d);
    var poll = setInterval(function(){ 
      if (gotDrag) { clearInterval(poll); d.remove(); attemptReconstruct(); } 
    }, 200);
    return;
  }

  var assembled = reassemblePieces();
  if (!assembled) {
    console.error('Assembled payload is null/invalid; cannot decompress');
    document.open();
    document.write('<meta name="robots" content="noindex,nofollow"><h2>Page failed to load</h2><p>Reassembly failed (see console)</p>');
    document.close();
    return;
  }

  try {
    // Now uses the REAL LZString library loaded in the <head>
    const html = LZString.decompressFromBase64(assembled);
    if (html == null) throw new Error('decompress returned null');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error('Decompression or document.write failed:', e);
    document.open();
    document.write('<meta name="robots" content="noindex,nofollow"><h2>Page failed to load</h2><p>Reconstruction failed (see console)</p>');
    document.close();
  }
}
