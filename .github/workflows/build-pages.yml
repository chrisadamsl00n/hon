name: Build and publish obfuscated Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static obfuscated page
        run: npm run build

      - name: Publish to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config --global user.name "${GIT_AUTHOR_NAME}"
          git config --global user.email "${GIT_AUTHOR_EMAIL}"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          fi

          # create a clean gh-pages branch and copy the generated site
          git checkout --orphan gh-pages || git checkout gh-pages
          git rm -rf . > /dev/null 2>&1 || true

          cp -R publish/. .

          # write robots.txt via printf to avoid YAML heredoc indentation issues
          printf 'User-agent: *\nDisallow: /n1.html\n' > robots.txt

          git add -A
          git commit -m "Publish obfuscated site" || echo "No changes to publish"
          git push --force origin gh-pages
